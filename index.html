<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>카메라 판독기</title>
<!-- 카메라 판독기 · 깃허브 전용 (예전 '평택 상온 지번 QR' 깃허브판 ptqr_hist_v1 자리를 이어받음) -->
<meta name="theme-color" content="#FFF6EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FFF6EA; --card:#FFFFFF; --ink:#16201F; --sub:#566461; --line:#E4D9C9;
  --teal:#0E9F8E; --teal-d:#08766A; --teal-t:#DDF6F1;
  --coral:#FF5E45; --coral-d:#C9361F; --coral-t:#FFE5DF;
  --sun:#FFC53D; --sun-d:#D39200; --sun-t:#FFF1C9;
  --edge:#E0D2BE;
  --mono:ui-monospace,Menlo,Consolas,"Roboto Mono","Droid Sans Mono","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ background:var(--bg); }
body{
  font-family:var(--sans);
  color:var(--ink); -webkit-user-select:none; user-select:none; overflow-x:hidden;
}
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
input{ font:inherit; color:var(--ink); -webkit-user-select:text; user-select:text; }
svg{ display:block; }
[hidden]{ display:none !important; }
#app{ max-width:480px; margin:0 auto; padding:10px 12px 26px; }

/* ── 머리 ── */
.hd{ display:flex; align-items:center; margin-bottom:10px; }
.hd > * + *{ margin-left:9px; }
.logo{ width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#12B7A2,#0B7E9B); display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 #075E66; flex:none; }
.logo svg{ width:30px; height:30px; }
.logo.blink svg{ animation:logoHop .5s ease-out; }
@keyframes logoHop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.25) rotate(-8deg); } 100%{ transform:scale(1); } }
.tt{ flex:1; min-width:0; line-height:1.2; }
.tt b{ display:block; font-size:20px; font-weight:900; letter-spacing:-.5px; }
.tt span{ display:block; font-size:12.5px; font-weight:700; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ib{ width:46px; height:46px; border-radius:14px; background:#fff; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); display:flex; align-items:center;
  justify-content:center; font-size:20px; flex:none; }
.ib svg{ width:24px; height:24px; }
.ib:active{ transform:translateY(3px); box-shadow:0 0 0 var(--ink); }
.ib.sm{ width:40px; height:40px; border-radius:12px; }

/* ── 모드 ── */
.modes{ display:flex; background:#F1E6D6; border-radius:18px; padding:5px; margin-bottom:10px; }
.modes button{ flex:1; display:flex; align-items:center; justify-content:center; height:58px; border-radius:14px; color:var(--sub); }
.modes button + button{ margin-left:5px; }
.modes button svg{ width:26px; height:26px; margin-right:8px; flex:none; }
.modes button span{ text-align:left; line-height:1.1; }
.modes button b{ display:block; font-size:19px; font-weight:900; }
.modes button small{ display:block; font-size:12px; font-weight:800; opacity:.85; }
.modes button.on{ background:var(--teal); color:#fff; box-shadow:0 4px 0 var(--teal-d); }
.modes button.on.t{ background:var(--coral); box-shadow:0 4px 0 var(--coral-d); }
.modes button:active{ transform:translateY(2px); }

/* ── 카메라 ── */
.vf{ position:relative; height:440px; border-radius:22px; overflow:hidden; background:#3B4A48; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); }
.vf video{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
.box{ position:absolute; left:7%; right:7%; top:13%; height:64%; transition:top .25s, height .25s, left .25s, right .25s; }
.box.t{ left:5%; right:5%; top:40%; height:21%; }
.box .c{ position:absolute; width:34px; height:34px; border:6px solid var(--sun); }
.box .tl{ top:-3px; left:-3px; border-right:none; border-bottom:none; border-top-left-radius:12px; }
.box .tr{ top:-3px; right:-3px; border-left:none; border-bottom:none; border-top-right-radius:12px; }
.box .bl{ bottom:-3px; left:-3px; border-right:none; border-top:none; border-bottom-left-radius:12px; }
.box .br{ bottom:-3px; right:-3px; border-left:none; border-top:none; border-bottom-right-radius:12px; }
.box.t .c{ border-color:#fff; }
.box.t{ border:3px dashed rgba(255,255,255,.95); border-radius:12px; box-shadow:0 0 0 2000px rgba(20,30,28,.28); }
.box .tip{ position:absolute; left:50%; top:-36px; transform:translateX(-50%); white-space:nowrap; background:var(--sun); color:var(--ink);
  font-size:13.5px; font-weight:900; padding:5px 11px; border-radius:10px; box-shadow:0 3px 0 var(--sun-d); }
.box.t .tip{ background:#fff; box-shadow:0 3px 0 #BFB3A2; }
.sweep{ position:absolute; left:4%; right:4%; height:3px; top:10%; background:linear-gradient(90deg,transparent,#FF5E45 20%,#FF5E45 80%,transparent);
  box-shadow:0 0 12px rgba(255,94,69,.9); animation:sweep 2.2s ease-in-out infinite; }
.box.t .sweep{ display:none; }
@keyframes sweep{ 0%,100%{ top:10%; } 50%{ top:88%; } }

/* 흔들림 표시 — 수평계 방울 */
.steady{ position:absolute; left:50%; top:10px; transform:translateX(-50%); display:flex; align-items:center; white-space:nowrap;
  background:#fff; border:2px solid var(--ink); border-radius:999px; padding:6px 12px 6px 7px; box-shadow:0 3px 0 var(--ink); }
.steady b{ font-size:14px; font-weight:900; }
.steady .lvl{ position:relative; width:34px; height:18px; border-radius:9px; background:var(--teal-t); border:2px solid var(--teal); margin-right:7px; overflow:hidden; }
.steady .lvl i{ position:absolute; top:2px; left:10px; width:10px; height:10px; border-radius:50%; background:var(--teal); }
.steady.ok .lvl i{ animation:bubOk 1.6s ease-in-out infinite; }
.steady.bad{ background:var(--coral-t); border-color:var(--coral-d); box-shadow:0 3px 0 var(--coral-d); }
.steady.bad b{ color:var(--coral-d); }
.steady.bad .lvl{ background:#fff; border-color:var(--coral); }
.steady.bad .lvl i{ background:var(--coral); animation:bubShake .45s ease-in-out infinite; }
@keyframes bubOk{ 0%,100%{ left:11px; } 50%{ left:13px; } }
@keyframes bubShake{ 0%{ left:1px; } 50%{ left:20px; } 100%{ left:1px; } }

.eng{ position:absolute; left:10px; bottom:10px; background:rgba(255,255,255,.94); border-radius:10px; padding:5px 9px; font-size:12.5px; font-weight:900; color:var(--sub); }
.vtools{ position:absolute; right:10px; bottom:10px; display:flex; }
.vtools .rb + .rb{ margin-left:8px; }
.rb{ width:48px; height:48px; border-radius:50%; background:#fff; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); display:flex; align-items:center;
  justify-content:center; font-size:15px; font-weight:900; }
.rb svg{ width:24px; height:24px; }
.rb.on{ background:var(--sun); }
.vflash{ position:absolute; top:0; left:0; right:0; bottom:0; background:#fff; opacity:0; pointer-events:none; }
.vflash.on{ animation:flash .35s ease-out; }
@keyframes flash{ 0%{ opacity:.9; } 100%{ opacity:0; } }
.voff{ position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:22px; background:#FBF3E6; }
.voff[hidden]{ display:none !important; }
.voff .ico{ width:66px; height:66px; color:var(--ink); margin-bottom:10px; }
.voff p{ font-size:15px; font-weight:800; color:var(--sub); line-height:1.55; }
.voff p b{ color:var(--ink); }
.voff .go{ max-width:260px; margin-top:14px; }
.voff.ph{ padding:8px; background:#FBF3E6; }
.voff.ph img{ display:block; max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; cursor:zoom-in; }
.busy{ display:flex; align-items:center; font-size:15px; font-weight:800; }
.busy i{ width:22px; height:22px; border-radius:50%; border:3px solid #D6CBBA; border-top-color:var(--teal); animation:spin .8s linear infinite; margin-right:10px; flex:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ── 읽는 중 숫자·글자 ── */
.live{ background:#fff; border-radius:18px; border:2px solid var(--line); padding:11px 13px 12px; margin-top:12px; }
.lv-h{ font-size:13px; font-weight:900; color:var(--sub); }
.lv-d{ font-family:var(--mono); font-size:27px; font-weight:800; letter-spacing:.5px; min-height:36px; word-break:break-all; margin-top:2px; }
.lv-d .u{ background:var(--sun); border-radius:6px; padding:0 2px; box-shadow:0 2px 0 var(--sun-d); }
.lv-d .ph{ color:#A9B3B0; font-size:18px; font-weight:700; letter-spacing:0; font-family:var(--sans); }
.live small{ display:block; font-size:13.5px; font-weight:800; color:var(--sub); margin-top:4px; line-height:1.45; }
.live small.good{ color:var(--teal-d); }
.lv-b{ display:flex; flex-wrap:wrap; }
.lv-b .btn-o{ margin:9px 8px 0 0; }
.btn-o.go-o{ background:var(--teal); color:#fff; border-color:var(--teal-d); box-shadow:0 3px 0 var(--teal-d); }
.btn-o.go-o:active{ box-shadow:0 0 0 var(--teal-d); }

.card{ background:#fff; border-radius:18px; border:2px solid var(--line); padding:12px; }
.photo{ margin-top:12px; }
.thumb-row{ display:flex; align-items:center; }
.thumb-row img{ width:64px; height:64px; object-fit:cover; border-radius:10px; border:2px solid var(--line); margin-right:10px; flex:none; background:#fff; }
.thumb-row .tx{ flex:1; min-width:0; font-size:14px; font-weight:700; color:var(--sub); line-height:1.45; }
.cands{ margin-top:10px; }
.cands button{ display:block; width:100%; text-align:left; min-height:52px; border-radius:12px; border:2px solid var(--ink); background:#fff; box-shadow:0 3px 0 var(--ink);
  font-family:var(--mono); font-size:19px; font-weight:800; padding:8px 12px; word-break:break-all; }
.cands button + button{ margin-top:8px; }
.cands .u{ background:var(--sun); border-radius:5px; padding:0 2px; box-shadow:0 2px 0 var(--sun-d); }
.cands button small{ display:block; font-family:var(--sans); font-size:12.5px; font-weight:800; color:var(--sub); margin-top:1px; }

.row2{ display:flex; margin-top:12px; }
.row2 > * { flex:1; }
.row2 > * + *{ margin-left:9px; }
.row3{ display:flex; margin-top:10px; }
.row3 > *{ flex:1; }
.row3 > * + *{ margin-left:8px; }
.big-o{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:72px; border-radius:16px; background:#fff; border:2px solid var(--ink);
  box-shadow:0 4px 0 var(--ink); font-size:15px; font-weight:900; padding:6px 4px; }
.row2.low .big-o{ flex-direction:row; min-height:60px; font-size:16px; }
.row2.low .big-o svg{ margin:0 8px 0 0; }
.big-o svg{ width:26px; height:26px; margin-bottom:4px; flex:none; }
.big-o:active{ transform:translateY(4px); box-shadow:0 0 0 var(--ink); }
.big-o.slack{ background:#4A154B; color:#fff; border-color:#2C0B2D; box-shadow:0 4px 0 #2C0B2D; }
.big-o.slack:active{ box-shadow:0 0 0 #2C0B2D; }
.big-o.slack.busy-b{ opacity:.7; }
.btn-o{ display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 14px; border-radius:12px; border:2px solid var(--ink); background:#fff;
  box-shadow:0 3px 0 var(--ink); font-size:14.5px; font-weight:900; white-space:nowrap; }
.btn-o svg{ width:18px; height:18px; margin-right:6px; flex:none; }
.btn-o:active{ transform:translateY(3px); box-shadow:0 0 0 var(--ink); }
.btn-o.wide{ width:100%; height:50px; font-size:15.5px; }
.go{ display:flex; align-items:center; justify-content:center; width:100%; height:64px; border-radius:18px; background:var(--teal); color:#fff; font-size:21px; font-weight:900;
  box-shadow:0 5px 0 var(--teal-d); margin-top:12px; }
.go svg{ width:26px; height:26px; margin-right:9px; }
.go:active{ transform:translateY(5px); box-shadow:0 0 0 var(--teal-d); }
.go.dim{ opacity:.5; }
.link{ font-size:14px; font-weight:900; color:var(--teal-d); }

/* ── 직접 입력 · 고치기 ── */
.back{ display:inline-flex; align-items:center; height:46px; padding:0 14px 0 8px; border-radius:14px; background:#fff; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  font-size:15.5px; font-weight:900; margin-bottom:12px; }
.back svg{ width:22px; height:22px; margin-right:4px; }
.back:active{ transform:translateY(3px); box-shadow:0 0 0 var(--ink); }
.sh{ display:flex; align-items:center; justify-content:space-between; margin:0 3px 8px; }
.sh > span{ font-size:14.5px; font-weight:900; color:var(--sub); }
.ecrop{ background:#fff; border-radius:12px; border:2px dashed #B9AE9E; padding:4px; margin-bottom:8px; }
.ecrop img{ display:block; width:100%; max-height:92px; object-fit:contain; }
.eref{ font-size:14px; font-weight:800; color:var(--sub); margin:0 3px 8px; word-break:break-all; line-height:1.6; }
.eref b{ font-family:var(--mono); font-size:17px; color:var(--ink); }
.eref .u{ background:var(--sun); color:var(--ink); border-radius:5px; padding:0 2px; }
.edisp{ background:#fff; border-radius:16px; border:2px solid var(--ink); box-shadow:inset 0 3px 0 rgba(22,32,31,.07); min-height:74px; display:flex; align-items:center;
  justify-content:center; flex-wrap:wrap; padding:8px 10px; font-family:var(--mono); font-size:29px; font-weight:800; letter-spacing:1px; text-align:center; }
.edisp .ph{ color:#A9B3B0; font-size:18px; font-weight:700; letter-spacing:0; font-family:var(--sans); }
.edisp .d{ display:inline-block; flex-shrink:0; padding:0 1px; border-radius:5px; cursor:pointer; }
.edisp .d.gr{ margin-right:.4em; }
.edisp .d.sel{ background:var(--sun); box-shadow:0 0 0 2px var(--sun-d); }
.edisp .d.miss{ min-width:.72em; text-align:center; color:var(--coral-d); box-shadow:inset 0 -3px 0 var(--coral); }
.edisp .d.miss.sel{ box-shadow:0 0 0 2px var(--sun-d), inset 0 -3px 0 var(--coral); }
.edisp .caret{ display:inline-block; width:3px; height:30px; background:var(--ink); margin-left:2px; vertical-align:middle; animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.mhint{ font-size:13px; font-weight:800; color:var(--sub); margin:6px 3px 0; }
.field{ display:block; width:100%; height:58px; border-radius:14px; border:2px solid var(--ink); background:#fff; padding:0 14px; font-size:17px; font-weight:800; outline:none; }
.field:focus{ box-shadow:0 0 0 3px var(--teal-t); border-color:var(--teal-d); }
.etext{ font-family:var(--mono); font-size:22px; letter-spacing:.5px; text-transform:uppercase; height:66px; }
.mstat{ display:flex; align-items:center; justify-content:space-between; margin:8px 3px 10px; min-height:24px; }
.mstat .len{ font-size:13.5px; font-weight:800; color:var(--sub); }
.badge{ font-size:13.5px; font-weight:900; padding:4px 9px; border-radius:8px; }
.badge.ok{ background:var(--teal-t); color:var(--teal-d); }
.badge.bad{ background:var(--coral-t); color:var(--coral-d); }
.badge.mid{ background:#F1E6D6; color:var(--sub); }
.pad{ display:grid; grid-template-columns:repeat(3,1fr); grid-gap:9px; }
.pad2{ display:grid; grid-template-columns:1fr 1fr; grid-gap:9px; margin-top:9px; }
.key{ height:58px; border-radius:15px; background:#fff; box-shadow:0 5px 0 var(--edge); font-family:var(--mono); font-size:28px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.key:active{ transform:translateY(5px); box-shadow:0 0 0 var(--edge); }
.key.del{ background:var(--coral-t); color:var(--coral-d); box-shadow:0 5px 0 #F0B3A6; font-size:24px; font-family:inherit; }
.key.del:active{ box-shadow:0 0 0 #F0B3A6; }
.mtools{ display:flex; justify-content:flex-end; margin-top:12px; }

/* ── 결과 ── */
.res{ position:relative; z-index:2; background:#fff; border-radius:22px; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); padding:12px 12px 10px; }
.res-h{ display:flex; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.res-h > *{ margin:0 6px 6px 0; }
.tag{ display:inline-flex; align-items:center; height:34px; padding:0 8px 0 12px; border-radius:10px; background:var(--ink); color:#fff; font-size:14.5px; font-weight:900; }
.tag svg{ width:16px; height:16px; margin-left:4px; }
.ok-b,.warn-b,.src-b{ display:inline-flex; align-items:center; height:30px; padding:0 9px; border-radius:9px; font-size:13px; font-weight:900; }
.ok-b{ background:var(--teal-t); color:var(--teal-d); }
.warn-b{ background:var(--coral-t); color:var(--coral-d); }
.src-b{ background:#F1E6D6; color:var(--sub); }
.res-code{ display:flex; justify-content:center; background:#fff; padding:6px 0; }
.res-code canvas{ display:block; }
.res-code.pop{ animation:resPop .45s cubic-bezier(.3,1.5,.5,1); }
@keyframes resPop{ 0%{ transform:scale(.92); } 100%{ transform:scale(1); } }
.res-txt{ font-family:var(--mono); font-size:24px; font-weight:800; text-align:center; word-break:break-all; margin:6px 2px 4px; line-height:1.45; }
.res-txt .u{ background:var(--sun); border-radius:6px; padding:0 2px; box-shadow:0 2px 0 var(--sun-d); }
.res-txt small{ display:block; font-family:var(--sans); font-size:13.5px; font-weight:800; color:var(--coral-d); margin-top:4px; line-height:1.45; letter-spacing:0; }
.seg{ display:flex; background:#F1E6D6; border-radius:12px; padding:4px; margin-top:8px; }
.seg button{ flex:1; height:42px; border-radius:9px; font-size:15.5px; font-weight:900; color:var(--sub); }
.seg button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 0 var(--edge); }
.typepick{ background:#FBF3E6; border-radius:12px; padding:10px; margin-top:8px; }
.typepick .why{ font-size:13px; font-weight:700; color:var(--sub); line-height:1.5; margin-bottom:8px; }
.typepick button{ display:inline-flex; height:38px; align-items:center; padding:0 11px; margin:0 6px 6px 0; border-radius:10px; border:2px solid var(--ink); background:#fff; font-size:14px; font-weight:900; }
.typepick button.on{ background:var(--ink); color:#fff; }
.note{ font-size:13.5px; font-weight:800; color:var(--teal-d); background:var(--teal-t); border-radius:10px; padding:8px 10px; margin-top:9px; line-height:1.5; }
.sender{ font-size:13px; font-weight:800; color:var(--sub); text-align:center; margin-top:8px; }
.sender button{ font-size:13px; font-weight:900; color:var(--teal-d); text-decoration:underline; margin-left:4px; }

/* ── 판 ── */
.sheet-wrap{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:150; background:rgba(22,32,31,.42); display:none; align-items:flex-end; justify-content:center; }
.sheet-wrap.on{ display:flex; }
.sheet{ width:100%; max-width:480px; max-height:86vh; overflow-y:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:12px 12px 26px; animation:up .22s ease-out; }
@keyframes up{ from{ transform:translateY(40px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }
.sh-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sh-top b{ font-size:18px; font-weight:900; }
.hrow{ display:flex; align-items:center; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 12px; }
.hrow + .hrow{ margin-top:8px; }
.hrow .hv{ flex:1; min-width:0; }
.hrow .hv b{ display:block; font-family:var(--mono); font-size:18px; font-weight:800; word-break:break-all; }
.hrow .hv small{ display:block; font-size:12.5px; font-weight:800; color:var(--sub); margin-top:2px; }
.hempty{ font-size:14.5px; font-weight:700; color:var(--sub); background:#fff; border:2px dashed var(--line); border-radius:14px; padding:18px 14px; text-align:center; line-height:1.5; }
.sizes button{ display:flex; align-items:center; width:100%; min-height:64px; border-radius:16px; border:2px solid var(--ink); background:#fff; box-shadow:0 4px 0 var(--ink); padding:8px 14px; text-align:left; }
.sizes button + button{ margin-top:10px; }
.sizes button b{ font-size:18px; font-weight:900; }
.sizes button small{ display:block; font-size:12.5px; font-weight:800; color:var(--sub); }
.sizes button.on{ background:var(--teal-t); border-color:var(--teal-d); box-shadow:0 4px 0 var(--teal-d); }
.sizes button:active{ transform:translateY(4px); box-shadow:0 0 0 var(--ink); }
.sizes .sz{ width:52px; height:40px; border:3px solid var(--ink); border-radius:6px; margin-right:12px; flex:none; background:#fff; }
.sheet .hint{ font-size:13.5px; font-weight:700; color:var(--sub); line-height:1.5; margin-top:12px; }

/* ── 사진 보기 ── */
.viewer{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:180; background:#FBF3E6; display:none; flex-direction:column; }
.viewer.on{ display:flex; }
.vbar{ display:flex; align-items:center; padding:10px; }
.vbar span{ flex:1; font-size:14px; font-weight:900; color:var(--sub); }
.vbar .btn-o + .btn-o{ margin-left:8px; }
.vimg{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
.vimg img{ display:block; max-width:none; }
.vimg.fit img{ max-width:100%; max-height:100%; margin:0 auto; }

/* ── 크게 보기 ── */
.big{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:220; background:#fff; display:none; align-items:center; justify-content:center; }
.big.on{ display:flex; }
.big canvas{ display:block; flex:none; }
.big .tip{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); font-size:14px; font-weight:900; color:var(--sub); background:#F1E6D6; border-radius:10px; padding:6px 12px; }
.res-code{ cursor:zoom-in; }

/* ── 알림 ── */
.toast{ position:fixed; left:50%; top:10px; transform:translate(-50%,-14px); max-width:92%; background:var(--ink); color:#fff; border-radius:14px; padding:12px 14px;
  font-size:15px; font-weight:800; display:flex; align-items:center; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:300; box-shadow:0 6px 20px rgba(0,0,0,.25); }
.toast.on{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.toast.err{ background:var(--coral-d); }
.toast.ok{ background:var(--teal-d); }
.toast button{ margin-left:10px; color:var(--sun); font-weight:900; font-size:15px; white-space:nowrap; }

.particle{ position:fixed; z-index:400; font-size:18px; pointer-events:none; animation:pt .7s ease-out forwards; }
@keyframes pt{ 0%{ transform:translate(-50%,-50%) scale(.6); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1); opacity:0; } }
.confetti{ position:absolute; z-index:1; font-size:20px; pointer-events:none; animation:cf 1.3s ease-out forwards; }
@keyframes cf{ 0%{ transform:translate(-50%,-50%) scale(.5); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity:0; } }
#vRes{ position:relative; }

/* ── 낮은 화면 ── */
@media (max-height:700px){
  .vf{ height:330px; }
  .hd{ margin-bottom:8px; }
  .tt span{ display:none; }
  .modes button{ height:52px; }
  .go{ height:56px; }
  .key{ height:50px; }
  .big-o{ min-height:64px; }
}
@media (max-height:600px){ .vf{ height:280px; } }
@media (prefers-reduced-motion:reduce){
  .sweep,.steady .lvl i,.logo.blink svg,.res-code.pop{ animation:none !important; }
}

</style>
</head>
<body>
<div id="app">
  <header class="hd">
    <div class="logo" id="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9v6M11 9v6M14 9v6M16.5 9v6"/></svg></div>
    <div class="tt"><b>카메라 판독기</b><span>읽은 코드를 PDA가 찍게 다시 띄워요</span></div>
    <button class="ib" id="histBtn" type="button" aria-label="기록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button class="ib" id="muteBtn" type="button" aria-label="소리">🔊</button>
  </header>

  <!-- ═════ 읽기 ═════ -->
  <section id="vScan">
    <div class="modes" id="modes">
      <button type="button" data-m="code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 5v14M7 5v14M10.5 5v14M14 5v14M16.5 5v14M20 5v14"/></svg><span><b>코드</b><small>바코드 · QR</small></span></button>
      <button type="button" data-m="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18L9 6l5 12M5.8 14h6.4"/><path d="M15 9.5h5M17.5 9.5V18"/></svg><span><b>글자</b><small>대문자 · 숫자</small></span></button>
    </div>

    <div class="vf" id="vf">
      <video id="vid" playsinline muted></video>
      <div class="box" id="box"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="sweep" id="sweep"></div><span class="tip" id="boxTip"></span></div>
      <div class="steady" id="steady" hidden><span class="lvl"><i></i></span><b id="steadyTx"></b></div>
      <div class="eng" id="eng" hidden></div>
      <div class="vtools" id="vtools" hidden>
        <button type="button" class="rb" id="torchBtn" hidden aria-label="플래시"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M8 2h8l-1 6H9z"/><path d="M9 8h6v4l-1 10h-4L9 12z"/></svg></button>
        <button type="button" class="rb" id="zoomBtn" hidden>1x</button>
      </div>
      <div class="vflash" id="vflash"></div>
      <div class="voff" id="voff"></div>
    </div>

    <div class="live" id="live" hidden>
      <div class="lv-h"><span id="lvLabel">읽은 숫자</span></div>
      <div class="lv-d" id="lvText"></div>
      <small id="lvMsg"></small>
      <div class="lv-b"><button type="button" class="btn-o go-o" id="lvUse" hidden>이대로 만들기</button><button type="button" class="btn-o" id="lvFix">이걸로 고치기 ›</button></div>
    </div>
    <div class="card photo" id="photo" hidden></div>

    <div class="row2 low">
      <button type="button" class="big-o" id="photoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>사진·캡처</button>
      <button type="button" class="big-o" id="manualBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h1M8 14h8"/></svg>직접 입력</button>
    </div>
    <input type="file" id="fileIn" accept="image/*" hidden>
  </section>

  <!-- ═════ 직접 입력 · 고치기 ═════ -->
  <section id="vEdit" hidden>
    <button type="button" class="back" id="eBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>카메라로 돌아가기</button>
    <div class="sh"><span id="eTitle">바코드 밑 숫자를 그대로 쳐 주세요</span><button type="button" class="link" id="ePhotoView" hidden>사진 보기</button></div>
    <div class="ecrop" id="eCrop" hidden></div>
    <div class="eref" id="eRef" hidden></div>
    <div class="edisp" id="eDisp"></div>
    <div class="mhint" id="eHint" hidden>틀린 자리를 누르면 그 자리만 고쳐요</div>
    <input class="field etext" id="eText" placeholder="예: MV20251119_00002_01" autocomplete="off" autocapitalize="characters" spellcheck="false" hidden>
    <div class="mstat"><span class="len" id="eLen"></span><span id="eBadge"></span></div>
    <div id="ePad">
      <div class="pad">
        <button type="button" class="key" data-d="1">1</button><button type="button" class="key" data-d="2">2</button><button type="button" class="key" data-d="3">3</button>
        <button type="button" class="key" data-d="4">4</button><button type="button" class="key" data-d="5">5</button><button type="button" class="key" data-d="6">6</button>
        <button type="button" class="key" data-d="7">7</button><button type="button" class="key" data-d="8">8</button><button type="button" class="key" data-d="9">9</button>
      </div>
      <div class="pad2"><button type="button" class="key del" data-d="del">⌫</button><button type="button" class="key" data-d="0">0</button></div>
    </div>
    <button type="button" class="go" id="eGo">코드 만들기</button>
    <div class="mtools"><button type="button" class="btn-o" id="eKind">영문·기호 입력</button></div>
  </section>

  <!-- ═════ 결과 (PDA가 찍는 화면) ═════ -->
  <section id="vRes" hidden>
    <div class="res">
      <div class="res-h" id="resHead"></div>
      <div class="res-code" id="resBox"><canvas id="resCanvas"></canvas></div>
      <div class="res-txt" id="resTxt"></div>
      <div class="seg" id="resSeg"><button type="button" data-v="bar" class="on">바코드</button><button type="button" data-v="qr">QR</button></div>
      <div class="typepick" id="resTypes" hidden></div>
      <div class="note" id="resNote">PDA로 이 화면을 찍으세요.</div>
    </div>
    <button type="button" class="go" id="nextBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>다음 읽기</button>
    <div class="row3">
      <button type="button" class="big-o slack" id="slackBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.1 15.1a2 2 0 1 1-2-2h2zm1 0a2 2 0 0 1 4 0v5a2 2 0 1 1-4 0zM8.1 5.1a2 2 0 1 1 2-2v2zm0 1a2 2 0 0 1 0 4h-5a2 2 0 1 1 0-4zM18.9 8.1a2 2 0 1 1 2 2h-2zm-1 0a2 2 0 0 1-4 0v-5a2 2 0 1 1 4 0zM15.9 18.9a2 2 0 1 1-2 2v-2zm0-1a2 2 0 0 1 0-4h5a2 2 0 1 1 0 4z"/></svg>슬랙 보내기</button>
      <button type="button" class="big-o" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>글자 복사</button>
      <button type="button" class="big-o" id="lblBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>님봇 라벨</button>
    </div>
    <div class="sender" id="sender" hidden></div>
    <div class="row2">
      <button type="button" class="btn-o wide" id="editBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>고치기</button>
      <button type="button" class="btn-o wide" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>이미지 저장</button>
    </div>
  </section>
</div>

<!-- 아래에서 올라오는 판: 기록 · 님봇 라벨 크기 · 이름 -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet" id="sheet">
    <div class="sh-top"><b id="shTitle"></b><button type="button" class="ib sm" id="shX" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="shBody"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="vbar"><span>사진 보기 · 밀어서 움직여요</span><button type="button" class="btn-o" id="viewerFit">맞춤</button><button type="button" class="btn-o" id="viewerX">닫기</button></div>
  <div class="vimg" id="viewerImg"></div>
</div>

<div class="big" id="big"><canvas id="bigCanvas"></canvas><span class="tip" id="bigTip"></span></div>

<div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

      done();

      playError(); toast(SLACK_ERR[j && j.error] || ('슬랙으로 못 보냈어요 (' + (j && j.error || '알 수 없음') + ')'), 'err');
    })
    .catch(function () {
      clearTimeout(timer);
      if (!SLACK.busy) return;
      done(); playError();
      toast('못 보냈어요. 인터넷이 되는데도 계속 이러면 앱스크립트 쪽(Slack.gs 넣기, 새 버전 배포, 액세스 「모든 사용자」)과 주소를 봐 주세요', 'err',
            RELAY_URL ? null : { label: '주소 다시 넣기', ms: 9000, fn: function () { askRelay(slackSend); } });
    });
}

/* ═════════ 판 (기록 · 라벨 · 이름) ═════════ */
function openSheet(title, html) {
  $('shTitle').textContent = title; $('shBody').innerHTML = html;
  $('sheetWrap').classList.add('on');
}
function closeSheet() { $('sheetWrap').classList.remove('on'); $('shBody').innerHTML = ''; }
function openHistory() {
  var list = hList('rd').slice(0, 60);
  var h = list.length ? list.map(function (it, i) {
    var e = it.e || {};
    return '<button type="button" class="hrow" data-i="' + i + '"><span class="hv"><b>' + esc(it.key) + '</b><small>' +
           esc((e.type === 'QR' ? 'QR' : BC.displayName(e.type || BC.guessType(it.key), it.key)) + ' · ' + (SRC[e.src] || '읽음') + ' · ' + ago(e.last)) + '</small></span></button>';
  }).join('') + '<div class="row2"><button type="button" class="btn-o wide" id="histClear">' + ICON.trash + '기록 전부 지우기</button></div>'
    : '<div class="hempty">아직 읽은 게 없어요.<br>읽은 코드가 여기에 쌓이고, 누르면 바로 다시 떠요.</div>';
  openSheet('읽은 기록', h);
  Array.prototype.forEach.call($('shBody').querySelectorAll('.hrow'), function (b) {
    b.addEventListener('click', function () {
      tap(); var it = list[+b.getAttribute('data-i')], e = it.e || {};
      closeSheet();
      showResult({ value: it.key, type: e.type || BC.guessType(it.key), gs1: !!e.gs1, source: 'hist' });
    });
  });
  var c = $('histClear');
  if (c) c.addEventListener('click', function () {
    tap();
    var removed = hLoad('rd');
    hSave('rd', {});
    closeSheet();
    toast('기록을 지웠어요', '', { label: '되돌리기', ms: 6000, fn: function () { hSave('rd', removed); toast('되돌렸어요', 'ok'); } });
  });
}

/* ═════════ 시작 ═════════ */
function bindAll() {
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  $('muteBtn').addEventListener('click', function () {
    muted = !muted; lsSet('ptqr_mute_v1', muted);
    this.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ac(); pluck(880, 0.12, 0.18); }
  });
  $('histBtn').addEventListener('click', function () { tap(); openHistory(); });
  Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) {
    b.addEventListener('click', function () { if (R.mode !== b.getAttribute('data-m')) setMode(b.getAttribute('data-m')); });
  });
  $('torchBtn').addEventListener('click', function () {
    tap(); if (!CAM.track) return;
    var want = !CAM.torch;
    CAM.track.applyConstraints({ advanced: [{ torch: want }] }).then(function () { CAM.torch = want; $('torchBtn').classList.toggle('on', want); })
      .catch(function () { toast('플래시를 못 켰어요', 'err'); });
  });
  $('zoomBtn').addEventListener('click', function () {
    tap(); if (!CAM.track || CAM.zooms.length < 2) return;
    CAM.zi = (CAM.zi + 1) % CAM.zooms.length;
    var z = CAM.zooms[CAM.zi];
    CAM.track.applyConstraints({ advanced: [{ zoom: z }] }).then(function () { $('zoomBtn').textContent = z + 'x'; }).catch(noop);
  });
  $('lvUse').addEventListener('click', function () {
    if (!CAM.lastDigits) return;
    tap();
    camAccept({ value: CAM.lastDigits, type: BC.guessType(CAM.lastDigits), source: 'text', unsure: CAM.lastUnsure || [] });
  });
  $('lvFix').addEventListener('click', function () {
    tap();
    openEdit(CAM.lastDigits || '', { kind: R.mode === 'text' ? 'text' : 'digits', cursor: CAM.lastLow, crop: CAM.lastCrop || null, unsure: CAM.lastUnsure || [] });
  });
  $('photoBtn').addEventListener('click', function () { tap(); photoPick(); });
  $('fileIn').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) fromFile(f); });
  $('manualBtn').addEventListener('click', function () { tap(); openEdit('', { kind: R.mode === 'text' ? 'text' : 'digits' }); });

  Array.prototype.forEach.call(document.querySelectorAll('#ePad .key'), function (b) {
    b.addEventListener('click', function () { sparkleAt(b); tap(); editKey(b.getAttribute('data-d')); });
  });
  $('eText').addEventListener('input', function () {
    var p = this.selectionStart, up = this.value.toUpperCase();
    if (up !== this.value) { this.value = up; try { this.setSelectionRange(p, p); } catch (e) {} }
    renderEdit();
  });
  $('eText').addEventListener('keydown', function (e) { if (e.key === 'Enter') editGo(); });
  $('eGo').addEventListener('click', function () { sparkleAt(this); tap(); editGo(); });
  $('eBack').addEventListener('click', function () { tap(); showView('scan'); });
  $('eKind').addEventListener('click', function () {
    tap();
    var E = R.ed; E.cur = null;
    if (E.kind === 'text') { E.v = cleanTyped($('eText').value).replace(/\D/g, '').slice(0, 48); E.kind = 'digits'; }
    else { $('eText').value = E.v.replace(/_/g, ''); E.kind = 'text'; setTimeout(function () { $('eText').focus(); }, 30); }
    renderEdit();
  });
  $('ePhotoView').addEventListener('click', function () { tap(); openViewer(); });

  $('nextBtn').addEventListener('click', function () { sparkleAt(this); tap(); showView('scan'); });
  Array.prototype.forEach.call(document.querySelectorAll('#resSeg button'), function (b) {
    b.addEventListener('click', function () { tap(); R.render = b.getAttribute('data-v'); renderResult(); });
  });
  $('slackBtn').addEventListener('click', function () { tap(); slackSend(); });
  $('copyBtn').addEventListener('click', function () { tap(); copyText(R.res.value, '글자를 복사했어요'); });
  $('lblBtn').addEventListener('click', function () { tap(); labelSheet(); });
  $('editBtn').addEventListener('click', function () {
    tap();
    var S = R.res, text = S.source === 'text' || S.source === 'phototext' || /[^0-9]/.test(S.value);
    openEdit(S.value, { kind: text ? 'text' : 'digits', unsure: S.unsure });
  });
  $('saveBtn').addEventListener('click', function () { tap(); saveImage(); });
  $('resBox').addEventListener('click', function () { openBig(); });
  $('big').addEventListener('click', function () { tap(); closeBig(); });

  $('shX').addEventListener('click', function () { tap(); closeSheet(); });
  $('sheetWrap').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  $('viewerX').addEventListener('click', function () { tap(); $('viewer').classList.remove('on'); });
  $('viewerFit').addEventListener('click', function () { tap(); $('viewerImg').classList.toggle('fit'); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('big').classList.contains('on')) closeBig();
      else if ($('viewer').classList.contains('on')) $('viewer').classList.remove('on');
      else if ($('sheetWrap').classList.contains('on')) closeSheet();
      return;
    }
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    if (e.ctrlKey || e.metaKey || e.altKey || $('sheetWrap').classList.contains('on')) return;
    if (R.view === 'edit' && R.ed.kind === 'digits') {
      var k = e.key;
      if (/^[0-9]$/.test(k)) { e.preventDefault(); playPress(); editKey(k); }
      else if (k === 'Backspace') { e.preventDefault(); playPress(); editKey('del'); }
      else if (k === 'Enter') { e.preventDefault(); editGo(); }
    }
  });
  window.addEventListener('resize', function () { if (R.view === 'res') renderResult(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (CAM.on || CAM.starting) { CAM.resume = true; camStop(); } }
    else if (CAM.resume) { CAM.resume = false; if (R.view === 'scan' && $('photo').hidden) camStart(); }
  });
}

/* 깃허브: 앱 설치 · 회사 와이파이용 저장 */
function setupPWA() {
  if (!HAS_VENDOR) return;
  var okProto = location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(HOST);
  if (!okProto || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'warmed' && !d.missing && !lsGet('jqr_rd_saved_v1', false)) {
      lsSet('jqr_rd_saved_v1', true);
      toast('이 폰에 판독기를 저장했어요. 이제 회사 와이파이에서도 열려요', 'ok', { label: '확인', ms: 6000, fn: noop });
    }
  });
  navigator.serviceWorker.register('sw.js').then(function () {
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    var files = ['index.html', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'zxing-reader.js', 'zxing_reader.wasm',
                 'tesseract.min.js', 'worker.min.js', ocrCoreFile(), 'eng.traineddata.gz'].map(abs);
    var w = reg.active || navigator.serviceWorker.controller;
    if (w) w.postMessage({ type: 'warm', files: files });
  }).catch(noop);
}

OCR.onState = renderEng;
bindAll();
setMode(R.mode, true);
setupPWA();
initNative();
showView('scan');

  scaleCanvas: scaleCanvas, loadImg: loadImg, digitize: digitize, cleanCode: cleanCode, openEdit: openEdit, showResult: showResult, setMode: setMode,
  textCanvas: textCanvas, readTextLine: readTextLine, symWords: symWords, wordsCode: wordsCode, lineCode: lineCode, OCR: OCR, DEC: DEC, CAM: CAM, R: R, WL_TEXT: WL_TEXT };


})();
